<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0" stop-color="#61b675"/>
      <stop offset="0.6" stop-color="#61b675"/>
      <stop offset="1" stop-color="#61b675"/>
    </radialGradient>
    <style>
      .c{fill:#ffffff;stroke:#1a1a1a;stroke-width:4}
      .g{fill:#fe8aa3;stroke:#1a1a1a;stroke-width:3}
      .dice{transform-box:fill-box;transform-origin:center;animation:roll 3s ease-in-out infinite}
      .d2{animation-delay:.25s}
      .token{animation:move 6s ease-in-out infinite}
      .t{font:700 56px -apple-system,'Segoe UI',sans-serif;fill:#1a1a1a;letter-spacing:4px}
      @keyframes roll{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(25deg)}90%{transform:rotate(-15deg)}}
      @keyframes move{0%,100%{transform:translate(0,0)}25%{transform:translate(600px,0)}50%{transform:translate(600px,520px)}75%{transform:translate(0,520px)}}
      @media (prefers-reduced-motion:reduce){.dice,.token{animation:none}}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g transform="translate(450 150)">
    <rect width="700" height="700" rx="32" fill="#fff6d6" stroke="#1a1a1a" stroke-width="6"/>
    <!-- 四邊格子 -->
    <g>
      <rect class="c" x="20" y="20" width="100" height="100" rx="14"/><rect class="c" x="140" y="20" width="90" height="100" rx="14"/><rect class="c" x="250" y="20" width="90" height="100" rx="14"/><rect class="c" x="360" y="20" width="90" height="100" rx="14"/><rect class="c" x="470" y="20" width="90" height="100" rx="14"/><rect class="c" x="580" y="20" width="100" height="100" rx="14"/>
      <rect class="c" x="20" y="580" width="100" height="100" rx="14"/><rect class="c" x="140" y="580" width="90" height="100" rx="14"/><rect class="c" x="250" y="580" width="90" height="100" rx="14"/><rect class="c" x="360" y="580" width="90" height="100" rx="14"/><rect class="c" x="470" y="580" width="90" height="100" rx="14"/><rect class="c" x="580" y="580" width="100" height="100" rx="14"/>
      <rect class="c" x="20" y="140" width="100" height="90" rx="14"/><rect class="c" x="20" y="250" width="100" height="90" rx="14"/><rect class="c" x="20" y="360" width="100" height="90" rx="14"/><rect class="c" x="20" y="470" width="100" height="90" rx="14"/>
      <rect class="c" x="580" y="140" width="100" height="90" rx="14"/><rect class="c" x="580" y="250" width="100" height="90" rx="14"/><rect class="c" x="580" y="360" width="100" height="90" rx="14"/><rect class="c" x="580" y="470" width="100" height="90" rx="14"/>
      <rect class="g" x="140" y="20" width="90" height="22" rx="8"/><rect class="g" x="360" y="20" width="90" height="22" rx="8"/><rect class="g" x="580" y="250" width="22" height="90" rx="8"/><rect class="g" x="250" y="658" width="90" height="22" rx="8"/>
    </g>
    <text class="t" x="350" y="300" text-anchor="middle">MONOPOLY</text>
    <text x="350" y="350" text-anchor="middle" style="font:500 28px -apple-system,'Segoe UI',sans-serif;fill:#1a1a1a">C++ · OOP</text>
    <!-- 骰子 -->
    <g class="dice"><rect x="240" y="400" width="96" height="96" rx="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/><circle cx="265" cy="425" r="9" fill="#1a1a1a"/><circle cx="288" cy="448" r="9" fill="#1a1a1a"/><circle cx="311" cy="471" r="9" fill="#1a1a1a"/></g>
    <g class="dice d2"><rect x="364" y="400" width="96" height="96" rx="20" fill="#ffd201" stroke="#1a1a1a" stroke-width="5"/><circle cx="389" cy="425" r="9" fill="#1a1a1a"/><circle cx="435" cy="425" r="9" fill="#1a1a1a"/><circle cx="389" cy="471" r="9" fill="#1a1a1a"/><circle cx="435" cy="471" r="9" fill="#1a1a1a"/></g>
    <!-- 棋子 -->
    <circle class="token" cx="70" cy="70" r="24" fill="#2d5db3" stroke="#1a1a1a" stroke-width="4"/>
  </g>
</svg>
